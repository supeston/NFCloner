name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Extract Version Name
        id: get_version
        run: |
          RAW_VERSION=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | sed 's/.*"\(.*\)".*/\1/' | tr -d '\r\n' | tr -d ' ')
          if [ -z "$RAW_VERSION" ]; then
            RAW_VERSION="1.2.7"
          fi
          echo "version=${RAW_VERSION}" >> $GITHUB_OUTPUT
          echo "Detected Version: [${RAW_VERSION}]"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/release/app-release.apk release_assets/NFCloner.apk

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.get_version.outputs.version }}"
          name: "NFCloner v${{ steps.get_version.outputs.version }}"
          body: |
            ### NFCloner v${{ steps.get_version.outputs.version }}

            - **Настройки по умолчанию**: При первой установке/чистом запуске приложения чтение банковских (EMV) и транспортных карт теперь по умолчанию отключено
            - **Максимальная скорость MIFARE Classic**: Без дополнительных режимов чтение и клонирование меток происходит моментально
            - **Полный PAN и транспортные карты**: При необходимости можно включить в настройках в один клик
          files: release_assets/NFCloner.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
